[package]
name = "hosven"
version = "2.0.0"
description = "Manage /etc/hosts, .env files and listening ports on macOS"
authors = ["Twan"]
license = "MIT"
repository = "https://github.com/twan-nguyen/hosven"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "hosven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "sync", "rt", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
jiff = "0.2"
notify = "8.2"
notify-debouncer-mini = "0.7"
security-framework = "3.7"
libc = "0.2"
plist = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
